# Rendered by the nginx image's envsubst step at container start (copied to
# /etc/nginx/templates/default.conf.template), so ${SPOTIFY_BASIC_AUTH} below
# is filled in from the environment — see spotify-auth.envsh. nginx's own
# $variables are left alone, since envsubst only touches defined env vars.

# The token endpoint is reachable from the internet once this sits behind
# SWAG, so cap how often anyone can mint tokens on our Spotify app's behalf.
limit_req_zone $binary_remote_addr zone=spotify_token:1m rate=6r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the app connects to (the HA websocket + REST API) happens
    # client-side, straight from the browser to Home Assistant. The one
    # exception is Spotify's token endpoint below, which needs the app's
    # client secret — so it's added here instead of shipping in the JS.

    location = /api/spotify-token {
        limit_req zone=spotify_token burst=5 nodelay;
        limit_except POST { deny all; }

        set $spotify_auth "${SPOTIFY_BASIC_AUTH}";
        if ($spotify_auth = "") {
            return 503;
        }

        proxy_pass https://accounts.spotify.com/api/token;
        proxy_ssl_server_name on;
        proxy_set_header Host accounts.spotify.com;
        proxy_set_header Authorization "Basic $spotify_auth";
        proxy_set_header Content-Type "application/x-www-form-urlencoded";
        proxy_set_header Cookie "";
    }

    # Service worker + manifest must never be cached long, or installed
    # PWAs would keep running an old build.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
}
