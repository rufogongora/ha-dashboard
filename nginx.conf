server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything the app connects to (the HA websocket + REST API) happens
    # client-side, straight from the browser to Home Assistant. This container
    # only ever serves the static React build — no proxying needed here.

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
